name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, queueing newer runs and cancelling
# in-progress ones. This prevents overlapping publishes to Pages.
concurrency:
  group: pages
  cancel-in-progress: true

# Required for actions/checkout, actions/setup-node, actions/configure-pages
# and the official deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run on forks / external PRs — they have no Pages write access and
# the build itself isn't useful for forks of a private Pages site.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Vite reads `base: "/josu-portfolio/"` from vite.config.js, so
        # the emitted asset URLs in dist/index.html are already
        # repo-path-absolute. No extra env var needed.
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
